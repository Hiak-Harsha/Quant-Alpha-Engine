[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-alpha-engine"
version = "0.1.0"
description = "Diversified multi-horizon quantitative trading, volatility, regime, news, and multi-model prediction system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "pyarrow>=15.0",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "vaderSentiment>=3.3.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.1",
    "optuna>=3.6",
    "arch>=7.0",
    "hmmlearn>=0.3.2",
    "shap>=0.45",
    "joblib>=1.4",
    "streamlit>=1.38",
    "plotly>=5.22",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
